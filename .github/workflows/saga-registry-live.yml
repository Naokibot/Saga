name: Saga live registry qualification
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  live-registry:
    runs-on: ubuntu-24.04
    environment: saga-registry-qualification
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - uses: actions/setup-go@v7
        with: {go-version: '1.23.x'}
      - run: python -m pip install -e '.[crypto]'
      - name: Materialize qualification signing key
        shell: bash
        run: |
          test -n "$SAGA_REGISTRY_SIGNING_KEY_PEM"
          umask 077
          printf '%s' "$SAGA_REGISTRY_SIGNING_KEY_PEM" > "$RUNNER_TEMP/saga-registry-signing.pem"
        env:
          SAGA_REGISTRY_SIGNING_KEY_PEM: ${{ secrets.SAGA_REGISTRY_SIGNING_KEY_PEM }}
      - name: Signed publish/search/install roundtrip over HTTPS
        run: python tools/registry_live_qualification.py
        env:
          SAGA_REGISTRY_LIVE: '1'
          SAGA_REGISTRY_URL: ${{ vars.SAGA_REGISTRY_URL }}
          SAGA_REGISTRY_TOKEN: ${{ secrets.SAGA_REGISTRY_TOKEN }}
          SAGA_REGISTRY_SIGNING_KEY: ${{ runner.temp }}/saga-registry-signing.pem
          SAGA_REGISTRY_QUALIFICATION_PACKAGE: ${{ vars.SAGA_REGISTRY_QUALIFICATION_PACKAGE }}
      - uses: actions/upload-artifact@v4
        with: {name: saga-public-registry-live, path: validation/public-registry-live-0.26.2.json}
