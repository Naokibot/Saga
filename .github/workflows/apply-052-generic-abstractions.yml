name: Apply Saga 0.52 Generic Abstractions

on:
  push:
    branches: [feature/saga-052-generic-abstractions]
    paths:
      - '.github/workflows/apply-052-generic-abstractions.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/saga-052-generic-abstractions
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: implementations/go/go.mod
      - name: Apply 0.52 generic abstraction changes
        run: python tools/apply_052_generic_abstractions.py
      - name: Format Go implementation
        run: gofmt -w implementations/go/cmd/saga-go
      - name: Install Saga
        run: python -m pip install -e .
      - name: Compile Python sources
        run: python -m compileall -q saga tools tests/test_generic_abstractions_052.py
      - name: Run Saga 0.52 regression
        run: python -m unittest tests.test_generic_abstractions_052
      - name: Run Saga 0.51 regression
        run: python -m unittest tests.test_generic_adts_051
      - name: Run current Python language regression
        run: >-
          python -m unittest
          tests.test_control_ga_050
          tests.test_production_industrial_049
          tests.test_virtual_hil_048
          tests.test_advanced_motion_047
          tests.test_precision_machine_046
          tests.test_language_synthesis_045
      - name: Run complete Go regression
        working-directory: implementations/go
        run: go test ./...
      - name: Run Go vet
        working-directory: implementations/go
        run: go vet ./...
      - name: Remove integration helper
        run: rm -f tools/apply_052_generic_abstractions.py
      - name: Commit validated source
        run: |
          git config user.name "K.Saga"
          git config user.email "SagaK-dev@users.noreply.github.com"
          git add -A
          git commit -m "Build generic abstraction foundations for Saga 0.52"
          git push origin HEAD:feature/saga-052-generic-abstractions
