name: Saga desktop native OS evidence

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'implementations/go/**'
      - 'tools/native_host_qualification.py'
      - 'pyproject.toml'
      - '.github/workflows/saga-desktop-native-os.yml'
  pull_request:
    paths:
      - 'implementations/go/**'
      - 'tools/native_host_qualification.py'
      - 'pyproject.toml'
      - '.github/workflows/saga-desktop-native-os.yml'

jobs:
  linux-native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - uses: actions/setup-go@v7
        with: {go-version: '1.23.x'}
      - name: Native host qualification
        run: python tools/native_host_qualification.py --expected-host linux --output validation/native-host-linux-ci.json
      - uses: actions/upload-artifact@v4
        with: {name: linux-native-evidence, path: validation/native-host-linux-ci.json}

  macos-native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - uses: actions/setup-go@v7
        with: {go-version: '1.23.x'}
      - name: Native host qualification
        run: python tools/native_host_qualification.py --expected-host macos --output validation/native-host-macos-ci.json
      - uses: actions/upload-artifact@v4
        with: {name: macos-native-evidence, path: validation/native-host-macos-ci.json}

  windows-native:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - uses: actions/setup-go@v7
        with: {go-version: '1.23.x'}
      - name: Native host qualification
        shell: pwsh
        run: python tools/native_host_qualification.py --expected-host windows --output validation/native-host-windows-ci.json
      - uses: actions/upload-artifact@v4
        with: {name: windows-native-evidence, path: validation/native-host-windows-ci.json}
