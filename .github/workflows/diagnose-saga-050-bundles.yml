name: Diagnose Saga 0.50 staged bundles

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ github.event.issue.title == 'SAGA-050-DIAGNOSE-BUNDLES' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.50.0-production-ga
          fetch-depth: 0

      - name: Inspect staged archives and canonical patch
        shell: python
        run: |
          from __future__ import annotations
          import base64, hashlib, io, json, lzma, subprocess, tarfile, zipfile
          from pathlib import Path

          report = {'schema': 1, 'release': '0.50.0', 'bundles': {}, 'canonical_patch': {}}
          groups = {
              'final-v3': [
                  '.github/saga-050-final-bundle-v3/part-00.b64',
                  '.github/saga-050-final-bundle-v3/part-01.b64',
                  '.github/saga-050-final-bundle-v3/part-02.b64',
                  '.github/saga-050-final-bundle-v3/segment-03-04.b64',
                  '.github/saga-050-final-bundle-v3/segment-05-06.b64',
                  '.github/saga-050-final-bundle-v3/segment-07-08.b64',
                  '.github/saga-050-final-bundle-v3/segment-09-10.b64',
                  '.github/saga-050-final-bundle-v3/segment-11-12.b64',
                  '.github/saga-050-final-bundle-v3/segment-13-14.b64',
                  '.github/saga-050-final-bundle-v3/segment-15-16.b64',
              ],
              'missing9-v4': [
                  '.github/saga-050-missing9-v4/part-00.b64',
                  '.github/saga-050-missing9-v4/tail-00.b64',
                  '.github/saga-050-missing9-v4/tail-01.b64',
                  '.github/saga-050-missing9-v4/tail-02.b64',
              ],
              'source-final': ['.github/saga-050-source-bundle-final/part-00.b64'],
              'source-incomplete': [
                  '.github/saga-050-source-bundle/part-00.b64',
                  '.github/saga-050-source-bundle/part-01.b64',
                  '.github/saga-050-source-bundle/part-02.b64',
                  '.github/saga-050-source-bundle/part-03.b64',
                  '.github/saga-050-source-bundle/part-04.b64',
                  '.github/saga-050-source-bundle/part-05.b64',
              ],
          }
          for label, paths in groups.items():
              item = {'paths': paths}
              missing = [p for p in paths if not Path(p).is_file()]
              item['missing_chunks'] = missing
              if missing:
                  report['bundles'][label] = item
                  continue
              try:
                  encoded = ''.join(Path(p).read_text(encoding='ascii') for p in paths)
                  encoded = ''.join(encoded.split())
                  compressed = base64.b64decode(encoded, validate=True)
                  item['compressed_size'] = len(compressed)
                  item['compressed_sha256'] = hashlib.sha256(compressed).hexdigest()
                  payload = lzma.decompress(compressed)
                  item['payload_size'] = len(payload)
                  item['payload_sha256'] = hashlib.sha256(payload).hexdigest()
                  try:
                      tf = tarfile.open(fileobj=io.BytesIO(payload), mode='r:*')
                      names = tf.getnames()
                      item['kind'] = 'tar'
                      item['members'] = len(names)
                      item['first_members'] = names[:40]
                  except tarfile.TarError:
                      try:
                          zf = zipfile.ZipFile(io.BytesIO(payload))
                          names = zf.namelist()
                          item['kind'] = 'zip'
                          item['members'] = len(names)
                          item['first_members'] = names[:40]
                      except zipfile.BadZipFile:
                          try:
                              text = payload.decode('utf-8')
                              item['kind'] = 'text'
                              item['prefix'] = text[:300]
                              item['line_count'] = text.count('\n') + 1
                          except UnicodeDecodeError:
                              item['kind'] = 'binary'
                              item['prefix_hex'] = payload[:64].hex()
              except Exception as exc:
                  item['error'] = f'{type(exc).__name__}: {exc}'
              report['bundles'][label] = item

          patch_parts = [Path(f'patches/saga-0.49.0-to-0.50.0-production-ga.patch.xz.part-{i:02d}') for i in range(6)]
          pinfo = report['canonical_patch']
          pinfo['missing_chunks'] = [str(p) for p in patch_parts if not p.is_file()]
          if not pinfo['missing_chunks']:
              try:
                  compressed = b''.join(p.read_bytes() for p in patch_parts)
                  pinfo['compressed_size'] = len(compressed)
                  pinfo['compressed_sha256'] = hashlib.sha256(compressed).hexdigest()
                  patch = lzma.decompress(compressed)
                  pinfo['patch_size'] = len(patch)
                  pinfo['patch_sha256'] = hashlib.sha256(patch).hexdigest()
                  Path('/tmp/saga-050.patch').write_bytes(patch)
                  subprocess.run(['git', 'worktree', 'add', '--detach', '/tmp/saga-049', '02157c5a8c1ff22c4c5ecb72b8e99d723d8dac08'], check=True, capture_output=True, text=True)
                  checked = subprocess.run(['git', '-C', '/tmp/saga-049', 'apply', '--check', '/tmp/saga-050.patch'], capture_output=True, text=True)
                  pinfo['apply_check_returncode'] = checked.returncode
                  pinfo['apply_check_stdout'] = checked.stdout[-2000:]
                  pinfo['apply_check_stderr'] = checked.stderr[-4000:]
              except Exception as exc:
                  pinfo['error'] = f'{type(exc).__name__}: {exc}'

          Path('validation').mkdir(exist_ok=True)
          Path('validation/saga-050-bundle-diagnostic.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2, sort_keys=True))

      - name: Commit diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Saga release automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -- validation/saga-050-bundle-diagnostic.json
          git commit -m 'Diagnose staged Saga 0.50 source bundles' || true
          git push origin HEAD:release/0.50.0-production-ga
