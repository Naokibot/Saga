name: Finalize Saga 0.50 source mirror

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.event.issue.title == 'SAGA-050-FINALIZE-SOURCE' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the production release branch
        uses: actions/checkout@v4
        with:
          ref: release/0.50.0-production-ga
          fetch-depth: 0

      - name: Reconstruct the canonical 0.50 manifest and large sources
        shell: bash
        run: |
          set -euo pipefail
          base=/tmp/saga-049
          patch_xz=/tmp/saga-050.patch.xz
          patch=/tmp/saga-050.patch
          git worktree add --detach "$base" 02157c5a8c1ff22c4c5ecb72b8e99d723d8dac08
          cat \
            patches/saga-0.49.0-to-0.50.0-production-ga.patch.xz.part-00 \
            patches/saga-0.49.0-to-0.50.0-production-ga.patch.xz.part-01 \
            patches/saga-0.49.0-to-0.50.0-production-ga.patch.xz.part-02 \
            patches/saga-0.49.0-to-0.50.0-production-ga.patch.xz.part-03 \
            patches/saga-0.49.0-to-0.50.0-production-ga.patch.xz.part-04 \
            patches/saga-0.49.0-to-0.50.0-production-ga.patch.xz.part-05 > "$patch_xz"
          echo '7ac568fb419396e47cc5582fafb37838ced613a886871e449043d947980923b9  '"$patch_xz" | sha256sum -c -
          xz -dc "$patch_xz" > "$patch"
          echo '24e60b4a2f5da9bdadc4e191ef6845ed471d2431a3e6dde5d933a4b5edf4e85c  '"$patch" | sha256sum -c -
          (cd "$base" && git apply --check "$patch" && git apply "$patch")
          for path in \
            implementations/go/cmd/saga-go/checker.go \
            implementations/go/cmd/saga-go/parser.go \
            release/source-manifest-0.50.0.json \
            saga/aot.py saga/checker.py saga/cli.py saga/mobile.py \
            saga/native_codegen.py saga/parser.py saga/stdlib/modules.py; do
            mkdir -p "$(dirname "$path")"
            cp "$base/$path" "$path"
          done

      - name: Restore staged source archives
        shell: python
        run: |
          from __future__ import annotations
          import base64, io, lzma, os, subprocess, tarfile, zipfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          bundles = [
              ('final-v3', [
                  '.github/saga-050-final-bundle-v3/part-00.b64',
                  '.github/saga-050-final-bundle-v3/part-01.b64',
                  '.github/saga-050-final-bundle-v3/part-02.b64',
                  '.github/saga-050-final-bundle-v3/segment-03-04.b64',
                  '.github/saga-050-final-bundle-v3/segment-05-06.b64',
                  '.github/saga-050-final-bundle-v3/segment-07-08.b64',
                  '.github/saga-050-final-bundle-v3/segment-09-10.b64',
                  '.github/saga-050-final-bundle-v3/segment-11-12.b64',
                  '.github/saga-050-final-bundle-v3/segment-13-14.b64',
                  '.github/saga-050-final-bundle-v3/segment-15-16.b64',
              ]),
              ('missing9-v4', [
                  '.github/saga-050-missing9-v4/part-00.b64',
                  '.github/saga-050-missing9-v4/tail-00.b64',
                  '.github/saga-050-missing9-v4/tail-01.b64',
                  '.github/saga-050-missing9-v4/tail-02.b64',
              ]),
              ('source-final', ['.github/saga-050-source-bundle-final/part-00.b64']),
          ]

          def safe_rel(name: str, strip: str | None) -> Path | None:
              p = PurePosixPath(name)
              if p.is_absolute() or '..' in p.parts:
                  raise RuntimeError(f'unsafe archive member: {name}')
              parts = list(p.parts)
              if strip and parts and parts[0] == strip:
                  parts = parts[1:]
              if not parts:
                  return None
              return Path(*parts)

          def extract_tar(payload: bytes, label: str) -> bool:
              try:
                  tf = tarfile.open(fileobj=io.BytesIO(payload), mode='r:*')
              except tarfile.TarError:
                  return False
              members = tf.getmembers()
              tops = {PurePosixPath(m.name).parts[0] for m in members if PurePosixPath(m.name).parts}
              strip = next(iter(tops)) if len(tops) == 1 and next(iter(tops)).startswith('saga-lang-0.50.0') else None
              for m in members:
                  rel = safe_rel(m.name, strip)
                  if rel is None or m.isdir():
                      continue
                  if not m.isfile():
                      raise RuntimeError(f'{label}: non-regular archive member rejected: {m.name}')
                  dest = root / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  src = tf.extractfile(m)
                  if src is None:
                      raise RuntimeError(f'{label}: could not read {m.name}')
                  dest.write_bytes(src.read())
                  if m.mode & 0o111:
                      dest.chmod(dest.stat().st_mode | 0o111)
              print(f'{label}: restored {sum(1 for m in members if m.isfile())} tar files')
              return True

          def extract_zip(payload: bytes, label: str) -> bool:
              try:
                  zf = zipfile.ZipFile(io.BytesIO(payload))
                  bad = zf.testzip()
                  if bad:
                      raise RuntimeError(f'{label}: corrupt zip member {bad}')
              except zipfile.BadZipFile:
                  return False
              names = [n for n in zf.namelist() if not n.endswith('/')]
              tops = {PurePosixPath(n).parts[0] for n in names if PurePosixPath(n).parts}
              strip = next(iter(tops)) if len(tops) == 1 and next(iter(tops)).startswith('saga-lang-0.50.0') else None
              for name in names:
                  rel = safe_rel(name, strip)
                  if rel is None:
                      continue
                  dest = root / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(zf.read(name))
              print(f'{label}: restored {len(names)} zip files')
              return True

          for label, paths in bundles:
              missing = [p for p in paths if not Path(p).is_file()]
              if missing:
                  print(f'{label}: skipped; missing chunks: {missing}')
                  continue
              encoded = ''.join(Path(p).read_text(encoding='ascii') for p in paths)
              encoded = ''.join(encoded.split())
              compressed = base64.b64decode(encoded, validate=True)
              payload = lzma.decompress(compressed)
              print(f'{label}: xz={len(compressed)} payload={len(payload)}')
              if extract_tar(payload, label) or extract_zip(payload, label):
                  continue
              try:
                  text = payload.decode('utf-8')
              except UnicodeDecodeError as exc:
                  raise RuntimeError(f'{label}: unknown binary payload') from exc
              if text.startswith('diff ') or '\ndiff ' in text or text.startswith('--- '):
                  patch = Path('/tmp') / f'{label}.patch'
                  patch.write_text(text, encoding='utf-8')
                  subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
                  subprocess.run(['git', 'apply', str(patch)], check=True)
                  print(f'{label}: applied patch payload')
                  continue
              raise RuntimeError(f'{label}: unsupported payload format: {text[:80]!r}')

      - name: Verify the complete source manifest
        id: verify
        shell: python
        run: |
          from __future__ import annotations
          import hashlib, json, os
          from pathlib import Path

          manifest_path = Path('release/source-manifest-0.50.0.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          files = manifest['files']
          missing = []
          mismatched = []
          for item in files:
              path = Path(item['path'])
              if not path.is_file():
                  missing.append(item['path'])
                  continue
              data = path.read_bytes()
              actual = hashlib.sha256(data).hexdigest()
              if len(data) != item['size'] or actual != item['sha256']:
                  mismatched.append({
                      'path': item['path'],
                      'expected_size': item['size'],
                      'actual_size': len(data),
                      'expected_sha256': item['sha256'],
                      'actual_sha256': actual,
                  })
          result = {
              'schema': 1,
              'release': '0.50.0',
              'manifest_files': len(files),
              'missing_count': len(missing),
              'mismatch_count': len(mismatched),
              'missing': missing,
              'mismatched': mismatched,
              'pass': not missing and not mismatched,
          }
          Path('validation').mkdir(exist_ok=True)
          Path('validation/github-source-sync-0.50.0.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"pass={'true' if result['pass'] else 'false'}\n")
          print(json.dumps({k: result[k] for k in ('manifest_files','missing_count','mismatch_count','pass')}, indent=2))
          if missing:
              print('First missing paths:')
              print('\n'.join(missing[:80]))
          if mismatched:
              print('First mismatches:')
              print(json.dumps(mismatched[:20], indent=2))

      - name: Run source-level smoke checks
        if: steps.verify.outputs.pass == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q saga tools tests
          python -m pytest -q tests/test_control_ga_050.py
          (cd implementations/go && go test ./...)
          (cd implementations/go && go vet ./...)

      - name: Clean transport-only staging files
        if: steps.verify.outputs.pass == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            .github/saga-050-actions-marker \
            .github/saga-050-final-bundle-v3 \
            .github/saga-050-finalize-trigger-20260822 \
            .github/saga-050-missing9-v4 \
            .github/saga-050-pr-trigger \
            .github/saga-050-source-bundle-final \
            .github/saga-050-source-bundle \
            .github/saga-050-trigger
          rm -f .github/workflows/install-saga-050-large-sources.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name .pytest_cache -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          rm -f validation/production-ga-0.50.0.partial.json

      - name: Commit the verified mirror or diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Saga release automation'
          git config user.email 'actions@users.noreply.github.com'
          if [[ '${{ steps.verify.outputs.pass }}' == 'true' ]]; then
            git add -A
            git commit -m 'Complete verified Saga 0.50 source mirror'
            git push origin HEAD:release/0.50.0-production-ga
          else
            git add -- validation/github-source-sync-0.50.0.json
            git commit -m 'Record Saga 0.50 source mirror gaps' || true
            git push origin HEAD:release/0.50.0-production-ga
            exit 1
          fi
