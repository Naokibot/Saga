name: Diagnose Saga 0.50 staged bundles v2

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ github.event.issue.title == 'SAGA-050-DIAGNOSE-BUNDLES-V2' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.50.0-production-ga
          fetch-depth: 0
      - name: Inspect individually decoded chunks
        shell: python
        run: |
          from __future__ import annotations
          import base64, hashlib, io, json, lzma, tarfile, zipfile
          from pathlib import Path

          expected_patch_parts = [
              '84b4d29f0f68fb61c8f8dbca278a0a86ddb8126064900760468e9a44c7dd2d0d',
              'f4a074ec249755f71d7e4b44227f47f1bc868948413312401454cab40c97c1b5',
              'a8d3854dec7e20d24280e40b1473f36ac01b8e58f6b8d27157ec79709c47833b',
              'da9b7db6c80d84dc10283061533c2e5f79dadc9c9fbf6842d50c667030232df7',
              'bb73f09ba900b5b483ffd643600ade8f3dfcc2b04766ffadbaf45b1c1179c660',
              'cfd5598a786897275fcc08375fb52bd9793e45dccc5293065376da0ab2e8c73e',
          ]
          groups = {
              'final-v3': [
                  '.github/saga-050-final-bundle-v3/part-00.b64',
                  '.github/saga-050-final-bundle-v3/part-01.b64',
                  '.github/saga-050-final-bundle-v3/part-02.b64',
                  '.github/saga-050-final-bundle-v3/segment-03-04.b64',
                  '.github/saga-050-final-bundle-v3/segment-05-06.b64',
                  '.github/saga-050-final-bundle-v3/segment-07-08.b64',
                  '.github/saga-050-final-bundle-v3/segment-09-10.b64',
                  '.github/saga-050-final-bundle-v3/segment-11-12.b64',
                  '.github/saga-050-final-bundle-v3/segment-13-14.b64',
                  '.github/saga-050-final-bundle-v3/segment-15-16.b64',
              ],
              'missing9-v4': [
                  '.github/saga-050-missing9-v4/part-00.b64',
                  '.github/saga-050-missing9-v4/tail-00.b64',
                  '.github/saga-050-missing9-v4/tail-01.b64',
                  '.github/saga-050-missing9-v4/tail-02.b64',
              ],
              'source-final': ['.github/saga-050-source-bundle-final/part-00.b64'],
          }
          report = {'schema': 2, 'release': '0.50.0', 'bundles': {}, 'patch_parts': []}
          for label, paths in groups.items():
              item = {'paths': paths, 'chunks': []}
              try:
                  decoded = []
                  for p in paths:
                      raw = ''.join(Path(p).read_text(encoding='ascii').split())
                      b = base64.b64decode(raw)
                      decoded.append(b)
                      item['chunks'].append({'path': p, 'decoded_size': len(b), 'decoded_sha256': hashlib.sha256(b).hexdigest()})
                  compressed = b''.join(decoded)
                  item['compressed_size'] = len(compressed)
                  item['compressed_sha256'] = hashlib.sha256(compressed).hexdigest()
                  payload = lzma.decompress(compressed)
                  item['payload_size'] = len(payload)
                  item['payload_sha256'] = hashlib.sha256(payload).hexdigest()
                  try:
                      tf = tarfile.open(fileobj=io.BytesIO(payload), mode='r:*')
                      names = tf.getnames()
                      item['kind'] = 'tar'
                      item['members'] = len(names)
                      item['first_members'] = names[:120]
                  except tarfile.TarError:
                      try:
                          zf = zipfile.ZipFile(io.BytesIO(payload))
                          names = zf.namelist()
                          item['kind'] = 'zip'
                          item['members'] = len(names)
                          item['first_members'] = names[:120]
                      except zipfile.BadZipFile:
                          try:
                              text = payload.decode('utf-8')
                              item['kind'] = 'text'
                              item['prefix'] = text[:1000]
                              item['line_count'] = text.count('\n') + 1
                          except UnicodeDecodeError:
                              item['kind'] = 'binary'
                              item['prefix_hex'] = payload[:128].hex()
              except Exception as exc:
                  item['error'] = f'{type(exc).__name__}: {exc}'
              report['bundles'][label] = item

          combined = b''
          for i, expected in enumerate(expected_patch_parts):
              p = Path(f'patches/saga-0.49.0-to-0.50.0-production-ga.patch.xz.part-{i:02d}')
              data = p.read_bytes()
              actual = hashlib.sha256(data).hexdigest()
              report['patch_parts'].append({'part': i, 'size': len(data), 'expected_sha256': expected, 'actual_sha256': actual, 'pass': actual == expected})
              combined += data
          report['patch_combined'] = {
              'size': len(combined),
              'sha256': hashlib.sha256(combined).hexdigest(),
              'expected_sha256': '7ac568fb419396e47cc5582fafb37838ced613a886871e449043d947980923b9',
          }
          try:
              payload = lzma.decompress(combined)
              report['patch_combined']['decompressed_size'] = len(payload)
              report['patch_combined']['decompressed_sha256'] = hashlib.sha256(payload).hexdigest()
          except Exception as exc:
              report['patch_combined']['error'] = f'{type(exc).__name__}: {exc}'

          Path('validation').mkdir(exist_ok=True)
          Path('validation/saga-050-bundle-diagnostic-v2.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2, sort_keys=True))
      - name: Commit diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Saga release automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -- validation/saga-050-bundle-diagnostic-v2.json
          git commit -m 'Inspect Saga 0.50 bundle chunk encoding' || true
          git push origin HEAD:release/0.50.0-production-ga
