name: Apply Saga 0.51 Generic ADTs

on:
  push:
    branches: [feature/saga-051-generic-adts]
    paths:
      - 'tools/apply_051_generic_adts.py'
      - 'tools/fix_051_match_runtime.py'
      - 'tools/fix_051_go_diagnostic_test.py'
      - '.github/workflows/apply-051-generic-adts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/apply_051_generic_adts.py'
      - 'tools/fix_051_match_runtime.py'
      - 'tools/fix_051_go_diagnostic_test.py'
      - '.github/workflows/apply-051-generic-adts.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.event_name == 'push' || github.head_ref == 'feature/saga-051-generic-adts'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/saga-051-generic-adts
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: implementations/go/go.mod
      - name: Apply 0.51 language changes
        run: python tools/apply_051_generic_adts.py
      - name: Apply enum match runtime fix
        run: python tools/fix_051_match_runtime.py
      - name: Stabilize Go diagnostic assertion
        run: python tools/fix_051_go_diagnostic_test.py
      - name: Format Go implementation
        run: gofmt -w implementations/go/cmd/saga-go
      - name: Install Saga
        run: python -m pip install -e .
      - name: Compile Python sources
        run: python -m compileall -q saga tools tests/test_generic_adts_051.py
      - name: Run complete Python 0.51 regression
        run: python -m unittest tests.test_generic_adts_051
      - name: Run prior language regression
        run: python -m unittest tests.test_language_synthesis_045
      - name: Run complete Go regression
        working-directory: implementations/go
        run: go test ./...
      - name: Run Go vet
        working-directory: implementations/go
        run: go vet ./...
      - name: Remove integration scaffolding
        run: rm -f tools/apply_051_generic_adts.py tools/fix_051_match_runtime.py tools/fix_051_go_diagnostic_test.py .github/workflows/apply-051-generic-adts.yml
      - name: Commit integrated source
        if: github.event_name == 'push'
        run: |
          git config user.name "K.Saga"
          git config user.email "SagaK-dev@users.noreply.github.com"
          git add -A
          git commit -m "Add generic algebraic data types for Saga 0.51"
          git push origin HEAD:feature/saga-051-generic-adts
